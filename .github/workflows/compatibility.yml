name: Compatibility

on:
  push:
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:upstream
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:client
      - run: pnpm test:transport
      - run: pnpm test:server
      - run: pnpm test:native-server
      - run: pnpm test:package
      - run: pnpm test:integration-packages
      - run: pnpm test:proxy
      - run: pnpm test:sdk-patch
      - run: pnpm test:durable-reader
      - run: pnpm check:api
